[pytest]
testpaths = tests
# The real Hermes/Ink subprocess suite needs the separately pinned /tmp source,
# built binaries, and an isolated terminal. Opt in with -o addopts=...
addopts = --import-mode=importlib -m "not native_fallback"
markers =
    native_fallback: real compiled Tern entry and pinned Hermes/Ink PTY qualification
