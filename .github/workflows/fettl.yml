name: Fettl changed-code gate

# Draft PR events stay skipped; manual dispatch permits the shadow evaluation.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fettl:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FETTL_VERSION: 0.19.78
      FETTL_ARCHIVE_SHA256: b989a935f10418c9d2058a8009f11675dae17c5891e134037a0771feeb326d4d
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out event-pinned PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing fork convention
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned local scanner
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/fettl-bin"
          mkdir -p "$install_dir"
          archive="$RUNNER_TEMP/fettl.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://downloads.fettl.dev/releases/v${FETTL_VERSION}/fettl-${FETTL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FETTL_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" fettl
          chmod 0755 "$install_dir/fettl"

      - name: Gate changed code without publishing source
        shell: bash
        run: |
          set -euo pipefail
          # Never execute PR scripts, install project dependencies, or invoke fixes.
          # No Fettl Action/App, login, diagnostics, agent, hosted assessment,
          # supervisor or SARIF upload is used; this CLI is accountless/local.
          export HOME="$RUNNER_TEMP/fettl-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"

          # Missing event commits/history fail closed; never fall back to full.
          # Manual events have no pull_request object. Resolve the fetched
          # default branch once, then use the exact commit for comparison.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            BASE_SHA="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"

          fettl="$RUNNER_TEMP/fettl-bin/fettl"
          cache="$RUNNER_TEMP/fettl-store"
          "$fettl" local-store init --root "$cache" \
            > "$RUNNER_TEMP/fettl-init.log" 2>&1

          # Changed code, NOT fingerprint-based NewOnly policy: existing
          # findings associated with modified code can still block.
          # Every nonzero exit fails: 1 findings, 2 timeout, 3 fatal/incomplete.
          # Do not filter 0.19.78's unreliable structured severity field.
          # Metadata JSON/diagnostics stay ephemeral: no artifacts/source upload.
          set +e
          "$fettl" check . \
            --diff-source "branch:${merge_base}..${HEAD_SHA}" \
            --privacy-mode metadata_only --format json \
            --cache-dir "$cache" --timeout 180 \
            > "$RUNNER_TEMP/fettl-metadata.json" \
            2> "$RUNNER_TEMP/fettl-diagnostics.log"
          status=$?
          set -e
          {
            printf '## Fettl %s changed-code gate\n\n' "$FETTL_VERSION"
            printf 'Comparison: `%s..%s` (event-pinned merge-base to head).\n\n' "$merge_base" "$HEAD_SHA"
            printf 'Exit: **%s** (0 clean; 1 findings; 2 timeout; 3 fatal/incomplete).\n\n' "$status"
            printf 'Accountless local CLI; no fixes or source-bearing uploads.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( status != 0 )); then
            printf '::error::Fettl changed-code gate failed (exit %s); no source-bearing diagnostics published.\n' "$status"
          fi
          exit "$status"
